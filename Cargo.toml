# The loopback HTTP door: `serve_with_listener`, the `CapFn` seam (a capability derived
# per request), `HttpRequest::peer`, and the route table the browse face will extend.
# ★ 0.1.27 is the floor for a reason this binary uses: `EdgeConfig::principal_fn`, the
# IDENTITY twin of the `CapFn` seam (ikigai-cli PR #358, ledger #76). The door already knew
# who a signed-in browser was — the session cookie resolves to an enrolled passkey — and used
# it only to mint the capability, so a comment typed into the page while signed in landed
# "(unattributed)". With the seam, the transport stamps every WRITE with a `principal`
# argument the door computed (`crate::doors::http_principal`: the passkey's stable IRI), a
# read carries none (an argument is part of the cache key, and a per-principal key on every
# GET would partition the cache by identity), and `?principal=…` in a query string is
# dropped — a submitter cannot name their own. `crate::web::Act` forwards that argument as
# the ledger's `author` and refuses a form field of that name.
# ★★ 0.1.30 is the floor now, and for a SECURITY reason this door is the one most exposed to
# (ledger #80, #591; ikigai-cli PR #362). Through 0.1.29 the request decoder sliced a lossy
# string by byte offset, so a raw invalid byte after a `%` PANICKED the connection's task —
# before the capability function ran, so before any `Host`, `Origin` or passkey check — and
# this loopback door is reachable by any local process and any page a browser on the machine
# has open. And no header deadline meant a slow-loris trickle held a connection forever.
# 0.1.30 decodes the target as bytes: a malformed escape is a `400` before gonk sees the
# request. It also bounds the edge in time and in
# connections (`header_timeout` 10s, `body_timeout` 30s, `write_timeout` 30s,
# `max_connections` 256); `doors::edge_config` takes those defaults on purpose, and
# `tests/doors.rs::the_http_door_takes_the_librarys_edge_bounds` says why and pins it.
# ⚠ The path's SHAPE moved with it, and gonk's routes can see it: a decoded `/` or `%` inside
# a segment stays escaped in `HttpRequest::path` (`%2F`, `%25`), so an encoded slash is data in
# its segment and never a separator, and `+` is literal in a path. The hostile link
# `rules::percent` builds for a ledger named `../../etc` — `/l/..%2F..%2Fetc/item/244` — used to
# fall through to the mechanical mapping; it now MATCHES `/l/{ledger}/item/{id}` with the
# ledger `../../etc`, and has to be refused by the page rather than by the router. (Since
# 0.1.37 the strict `{ledger}` refuses it at the edge instead — see the 0.1.37 note below;
# `tests/web.rs::a_hostile_ledger_link_is_refused_never_resolved` pins both refusals.)
# 0.1.31 is the reason for the current floor: HONEST CACHE HEADERS (ledger #604). Before it, a
# kernel answer with `Expiry::Never` went out as `public, max-age=31536000, immutable`, so a
# browser kept gonk's `/iki/ledger/items` listing for a YEAR and never revalidated. Now `Never`
# is `no-cache` with the strong ETag (a cheap 304 while unchanged), a read shaped by a session
# cookie is `private`, and one `Vary` names `Accept`, `Authorization, Cookie` and `Origin`.
# gonk's own HTML pages already sent `no-store`, so only the mechanical `/iki/*` faces change.
# ⚠ It is a FLOOR and a CEILING both (`^0.1.31` is `<0.2.0`), and the crate ships from the
# cli's workspace on a shared version, so this line moves when that workspace releases.
# ★★ 0.1.37 is the floor now, and it is a FLAG DAY for this door (ledger #740, ikigai-cli PR
# #397): route variables are STRICT. A `{var}` refuses a decoded value carrying any of
# `: / ? # [ ] @` (raw or percent-encoded) with a FINAL 400 naming the variable — no later route
# and no mechanical mapping answers it — and `{+var}` opts a variable into carrying them raw.
# The browse door's captures are IRIs, colons and all, so `doors::browse_routes` writes
# `{+pN}`; every other variable here (`{ledger}`, `{id}`, `{op}`, `{name}`) stays strict, which
# closes the hostile ledger link at the edge rather than at the page (`tests/web.rs`). Also in
# 0.1.36/0.1.37 and not relied on: a CORS preflight answers under the route's own policy, and
# `If-Match` is a strong comparison.
# ★ 0.1.41 is the floor now (ledger #879, ikigai-cli PR #416): `EdgeConfig::admit_fn`, an
# admission hook that runs BEFORE the push stream, `OPTIONS`, the `?description` face and
# dispatch. gonk's foreign-`Host` and cross-site refusals moved into it (`doors::admit_fn`), so a
# request this door refuses no longer learns the declared verbs or the contract of the
# capability-free actions behind it. Also in 0.1.41 and relied on: a `?principal=` is dropped on
# READS too, so no query string can name a principal on any verb.
# `tests/audit_864.rs::a_refused_request_gets_no_options_and_no_description` is the FLOOR TEST.
# 0.1.44: the one-release reason.
# 0.1.52 (ledger #1287): the one-release reason (see `ikigai-quic` above). 0.1.50 makes the HTTP
# door bind before its banner (ledger #1223); gonk already binds its own listener and hands it to
# `serve_with_listener`, so that change does not reach it.
# 0.1.55 (ledger #1335): the one-release reason.
# 0.1.56 (ledger #1378): the one-release reason (see `ikigai-quic` above). The HTTP edge did not
# change in 0.1.56.
# ★ 0.1.57 is the floor now, a BEHAVIOR one (ledger #1378, ikigai-cli PR 474): a DELETE whose
# endpoint answers with a non-empty body is a `200` carrying it, where through 0.1.56 it was a
# `204` with the body dropped; an empty answer is still `204`. Every ledger Delete answers a
# sentence, so on the mechanical door (`DELETE /iki/ledger/…`) each is now a `200`. Also in
# 0.1.57 and relied on: a Delete's `404` carries the endpoint's message, and the tombstone that
# makes a repeated DELETE a `204` keys on the query as well as the path. Nothing in gonk
# depended on the old `204`: the browser deletes through `POST /act` (a Sink at the edge) and
# the starter's scripts through the cli over the socket or QUIC.
# `tests/web.rs::an_http_delete_answers_with_the_ledgers_text` is the FLOOR TEST: on 0.1.56 the
# deferral's Delete answers `204` with no body.
# ⚠ 0.1.57 also offers a typed JSON error body (`EdgeConfig::error_body`), and gonk leaves it at
# the default, `text/plain`: one setting covers every route on the door, and `web/gonk.js` shows
# an error's body to a person as text (`htmx:responseError`, and the passkey `post` helper), so
# a JSON body would reach the page as raw JSON. `"0.1.57"` is `<0.2.0`.
# 0.1.58 (ledger #1379): the one-release reason.
# 0.1.59 (ledger #1381): the one-release reason.
# ★ 0.1.60 is the floor now, a BEHAVIOR one again (ledger #1408, ikigai-cli PR 482): a request
# that asks `Expect: 100-continue` is sent the interim `100 Continue` once its head passes the
# checks made on the head alone (framing, the declared length), and only then is its body read.
# Through 0.1.59 `read_request` read the body without sending it, so a client that holds its body
# back for the invitation (curl, a JVM HTTP client) waited out its own expect timeout, 1 to 3 s,
# on every POST with a body, and a client that never gives up waited the 30 s body deadline for
# a `408`. Every route on this door reads through `read_request`, so it covers them all.
# `tests/web.rs::a_post_expecting_100_continue_is_invited_at_once` is the FLOOR TEST: on 0.1.58
# the door says nothing at all to the head. 0.1.57's DELETE behavior above still holds.
# `"0.1.60"` is `<0.2.0`.
# 0.1.61 (ledger #1411, #1426): the one-release reason. Its one change to this door's crate is
# Windows-only (a dead listener's WinSock error now ends the accept loop instead of backing off
# forever); 0.1.60 is still the behavior floor above. `"0.1.61"` is `<0.2.0`.
# 0.1.62 (ledger #1489, #520): the one-release reason. Its one change to this door's crate: a
# `PATCH` is stamped (`received`, `client`, `principal`) like every other write. gonk routes no
# `PATCH` of its own; 0.1.60 is still the behavior floor above. `"0.1.62"` is `<0.2.0`.
# ★ 0.1.66 is the floor now, a BEHAVIOR one again (ledger #1546, #1923, ikigai-cli PR 557): the
# door's error table is the decided one. `Error::RetryAfter` → `429 Too Many Requests` with
# `Retry-After` in whole seconds (rounded up, never 0); `Timeout` → `504` (was `503`);
# `OverBudget` → `422`; `Refused` → `502`; `Unsupported` → `405` with `Allow` (a verb) or `501`
# (a facility); `DepthExceeded` and `Endpoint` stay `500`. With `ikigai-throttle` 0.2.0 above
# that is what makes a rate-limited anonymous run a `429` at this door instead of a `500`
# (ledger #1216 part 1, #1273). `tests/anonymous_runs_1210.rs::the_anonymous_run_rate_is_configurable`
# is the FLOOR TEST: on 0.1.62 the third run is `500 Internal Server Error` with no `Retry-After`.
# ★ 0.1.67 is the floor now, an API one (ledger #2021, #2025, ikigai-cli PR 562):
# `EdgeConfig::error_page`, the door's own HTML for an error a browser navigates to. gonk's
# (`crate::refusal`) puts a refusal in gonk's page shell, with the passkey sign-in on it when
# signing in would cure it; the status and the error headers are the library's. Through 0.1.66
# every text error became the library's fixed, unstyled page. 0.1.66's error table above still
# holds. `"0.1.67"` is `<0.2.0`.
ikigai-web = "0.1.67"
# Compression as RESOURCES, for the backup family (`crate::backup`). Bound into the hub,
# so a backup reaches gzip by resolving `urn:compress:gzip` through the kernel rather than
# by calling a gzip crate — which is the whole reason a module was built instead of a
# helper. Three properties this server relies on and did not measure itself: the gzip
# header fields are PINNED (so two backups of unchanged data are byte-identical), the
# endpoints require NO capability (compression is pure computation over bytes the caller
# already holds, so the backup path widens no authority), and decompression is BOUNDED —
# `max-bytes` refuses rather than truncates, which is what makes restoring an archive from
# outside this machine safe to attempt.
# ⚠ It also registers TRANSREPTORS (`* -> application/gzip` and back). Nothing in this
# server asks for `as=application/gzip` except `crate::backup`, so the planner gains a
# route no page can reach; `tests/conformance.rs` pins the four ids so a version that
# binds more is a red test.
# 0.2.0 (ledger #987): the space names itself `urn:iki:space:compress`; `^0.1.0` was `<0.2.0`.
ikigai-compress = "0.2.0"
# ★ The backup's archive is STREAMED into a gzip encoder (ledger #1699) instead of handed whole to
# `urn:compress:gzip`: the dump held the dataset several times over (the SPARQL JSON answer, the
# N-Quads, a copy of them for the call), so it now writes each quad into this encoder as it reads
# it. The encoder is the one `ikigai-compress` 0.2.0 uses, with its level and its pinned header
# (`crate::backup::GZIP_LEVEL`), and `tests/backup.rs` pins that the archive is byte for byte what
# `urn:compress:gzip` writes for the same N-Quads. An edge to a crate already in the graph.
# The floor is the one `ikigai-compress` 0.2.0 asks for (1.1.10, `rust_backend`, which unifies
# here): the archive's bytes are the encoder's, so this is the same encoder, not merely its API.
flate2 = "1.1.10"
# The timer that fires the backup. gonk holds the store, so gonk schedules the backup:
# an external scheduler's failure mode is "gonk healthy, data changing, backups stopped,
# nobody knows", and a backup job must not be able to outlive the thing it protects.
# 0.3.0 is the floor and it is the reason this is usable at all: `JobHealth` gained
# `last_success`, `since_last_success` and `failures_in_a_row` there, which is exactly the
# difference between "overdue" and "failing" that a 24-hour cadence needs —
# `urn:iki:gonk:backup:status` reports them.
# ★ 0.4.0 is the floor now, and for a SECURITY reason (ledger #79, ikigai-cli PR #356): through
# 0.3.0 every job fired under the REGISTRY's capability, which defaults to root — a caller who
# could reach `urn:time:schedule` fired any request at full authority. 0.4.0 records the
# capability that SCHEDULED each job and fires every tick under `ceiling.clamp(recorded)`, and
# `schedule` takes that capability as a required argument. 0.3.0 is YANKED (2026-09-24), so
# `^0.3.0` no longer resolves fresh at all; this pin had to move. gonk was never exposed — it
# scopes the registry to `backup::JOB_SCOPES` and binds no control plane — and now names the
# same scopes on the job itself.
# ⚠ Only `JobRegistry` + `ThreadTimer` are used. The `urn:time:*` CONTROL PLANE is still
# deliberately NOT bound: the backup's target set is fixed at startup by `main`, nothing here
# needs a caller to schedule, and every bound endpoint is surface. See `crate::backup`.
# 0.4.1: the published head.
# 0.4.2 (ledger #1378): the published head, moved with the cli 0.1.56 crates above so the graph
# holds that workspace's current release. A tick now keeps the principal that scheduled it after
# the ceiling's clamp (ledger #1077). The backup job names no principal (`backup::JOB_SCOPES`
# alone), so it fires exactly as it did on 0.4.1.
ikigai-time = "0.4.2"
# `Endpoint::invoke` is async_trait; the hub-forwarding endpoint in `doors.rs` is one.
async-trait = "0.1"
# The HTTP door's accept loop. The QUIC door owns its own runtime (ikigai-quic). `sync` is the
# Queue's one-read-per-root lock (`queue::Reads`, ledger #947): an async mutex, so a request
# waiting for another's read parks instead of holding a worker thread.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync"] }
# `clients.json` and `grants.json` — the same two files, in the same shapes, that
# `ikigai serve quic://…` reads.
serde_json = "1"
# `DeserializeOwned`, the bound on the bridges' one generic JSON read (`roborev::Door::json`),
# which reads `ikigai_ledger::json`'s types. Already in the graph through serde_json.
serde = "1"
# The HTML face's renderer: `transform_xml`, xrust's XSLT called as a library function.
# ⚠ The CRATE, not its endpoint — `urn:xslt:transform` is never bound here, so the served
# catalog does not widen and its `http(s)://` fetch path (through `urn:httpGet`) does not
# exist in this binary. `transform_xml` is present from 0.1.0; 0.1.3 is what is built and
# tested, and was not re-resolved from scratch at `=0.1.0`.
#
# ★ **0.1.3 CACHES THE COMPILED STYLESHEET, and for this binary that is the difference
# between paying to compile `gonk.xsl` on every HTML request and paying once per process**
# (ledger #453). Measured here with `cargo run --release --example render-cost` over 425 real
# ledger items, two renders in one process, which is the shape a long-lived server has:
#
#   0.1.2   first render 224ms · second (50 rows) 638ms
#   0.1.3   first render 226ms · second (50 rows) 455ms
#
# The FIRST render is unchanged — compiling is not faster, it is amortized — and every render
# after it in the process drops by ~183ms. That floor sits under every page this server
# serves, the Queue page included, so it is a larger share of a small page than of a big one.
#
# ⚠ It is a PERFORMANCE property, not an API floor: `transform_xml`'s signature is unchanged
# and 0.1.2 still compiles. The pin states what is built and tested, which is what this
# manifest's pins have always meant — and stating it is what makes the property reachable for
# anyone building without our lockfile, which `cargo install` without `--locked` is (rule 9d).
# ★ 0.2.1 (ledger #916, #1040, #1047): caller XML is bounded in depth and runs on a sized stack,
# and EVERY transform is answered within a time budget — 5 s unless the host names its own.
# gonk names its own (`render::RENDER_BUDGET`, 60 s in release, 10 min in debug): the 5 s
# default refused ordinary pages in a debug build on a loaded machine. `^0.1.3` was `<0.2.0`.
ikigai-xslt = "0.2.1"
