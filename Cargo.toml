# timestamps sort by time. On 0.16.x the cross-root write is open, which is why this is the floor.
# `tests/browse.rs::deleting_an_annotation_needs_a_read_grant_on_its_own_root` is the FLOOR TEST:
# red on 0.16.1, where `urn:cap:annotate` alone deletes. `^0.17.0` is `<0.18.0`. Minor: a
# narrowed Delete (it refuses calls that used to succeed). 0.18.0: the explain and review
# controls say what a click will cost (archived, or a live model call) and show a polite live
# region while it runs; additive. 0.18.1 (ledger #818): a review answer's last finding is kept
# when it cannot have been cut.
# ★ 0.18.2 (ledger #1126, browse PR #86) is a SECURITY floor: `.git` is never served. On 0.18.1
# `list_entries` was a raw `read_dir` and the jail only kept a path inside its root, so an
