# `urn:shacl:validate`, which `urn:plan:validate` composes (a plan is validated against the
# vocabulary's shapes before it is stored, and again before it runs). It is linked for the plan
# doors ALONE, and gonk never serves it to a caller: every door refuses `urn:shacl:*` as it
# arrives (`crate::doors::not_served`, `NOT_SERVED`), so only the plan doors' own sub-requests
# reach it, with `ikigai_vocab::SHAPES` and a plan the script library has bounded at 1 MiB.
# ★ `default-features = false` (ledger #1176): the `rudof` feature is OFF, and since 0.3.5 the
# endpoint is then served by ikigai-shacl's subset validator (`ikigai_shacl::core_shacl`).
# - **Why off.** rudof cannot be built without a network stack (reqwest from `rudof_iri`, and
#   oxigraph's `http-client` from `rudof_rdf`'s native target), so linking it compiled an HTTP
#   client into gonk for nothing; and rudof's validator recurses along the DATA, so a deep enough
#   chain overflowed its thread and ABORTED the process that holds the store. The subset links
#   neither and recurses over neither graph. Off, the installed binary drops 111 packages
#   (527 → 416 across all targets), reqwest and `http-client` among them.
# - **What the subset covers**: every construct in `ikigai_vocab::SHAPES` (class targets, node
#   and single-predicate property shapes, the count, kind, datatype, `sh:in` and `sh:pattern`
#   constraints, and the SHACL-SPARQL `sh:select` constraints under the store's size, nesting,
#   no-SERVICE and time-budget guards). ikigai-shacl checked it against rudof over the plan shapes.
# - **A shape outside the subset is REFUSED by name, never skipped**, so a vocabulary release that
#   used a new construct would make every plan fail validation (fail closed: none runs), not pass.
#   `tests/plan_shapes_1176.rs` runs the subset over this lock's vocabulary and gonk's plans.
# ★ **Test builds now match the binary** (ledger #1405). Until ikigai-layers 0.2.9 (a
# dev-dependency, below) took ikigai-shacl with `default-features = false`, a test build unified
# its default features and so compiled rudof back in: the hub in the test suite validated through
# rudof while the installed binary validated through the subset. Now neither graph links rudof
# (`cargo tree -e features -i ikigai-shacl` shows no `rudof` feature, `cargo tree -i rudof_rdf`
# finds nothing), so every test that composes the hub exercises the binary's validator.
# `tests/plan_shapes_1176.rs` still binds the subset directly too. The rudof-vs-subset
# differential lives in ikigai-shacl (`tests/differential.rs`), not here.
# 0.3.5 is the floor of the feature.
# 0.3.6 (ledger #1396): `futures` is no longer a normal dependency of the library (only its wasm
# `module` feature takes it), so the subset build links exactly what `ikigai-store` already does.
# ⚠ That moves nothing in THIS binary's graph: `futures` stays, through `ikigai-engine`,
# `ikigai-resolve`, `ikigai-throttle` and `ikigai-jsonld` (`cargo tree -e no-dev -i futures`).
# The subset also implements `sh:closed` and `sh:ignoredProperties`; no shape in
# `ikigai_vocab::SHAPES` uses them today, so a plan validates exactly as on 0.3.5, and a
# vocabulary release that closes a shape is validated rather than refused. `"0.3.6"` is `<0.4.0`.
ikigai-shacl = { version = "0.3.6", default-features = false }
# ★ Natural language to a DRAFT query (ledger #1138, `crate::nl`): `urn:nl:grounding` (what a
# drafter may know, composed under the CALLER's capability), `urn:nl:sparql:check`, the prompt
# templates, and `urn:nl:sparql`, which drafts through the mounted `urn:llm:` peer and saves a
# `state=draft` script through `ikigai-script` above. It links no model client and no network
# code of its own: the model is the mount, so this adds no outbound surface.
# ★ 0.2.0 is the floor now (ledger #1203): every draft's ask carries `max_tokens` (`Llm`'s
# default, `DEFAULT_MAX_TOKENS`), so a reasoning model cannot spend its whole budget thinking;
# gonk builds its `Llm` from that default and needed no change. `"0.1.0"` was `<0.2.0`, a
# ceiling. 0.2.1 (ledger #1196) asks ikigai-script's own rule whether a caller may read a named
# example, so a namespace grant counts; it takes ikigai-script 0.3.x, which gonk already pins.
# ★ 0.3.0 is the floor now (ledger #1243, #1242; ikigai-nl PR 12), and `"0.2.0"` was a CEILING
# that held it out: through 0.2.x the drafter's grounding carried the caller's whole manifold,
# about 100 KB of browse actions per root, so on the live gonk (51 roots) every UNFOCUSED draft
# was refused before any model call at ~4.9 MB against the 1 MiB bound. 0.3.0's drafter and check
# read only the vocabulary, the graphs and the examples (`parts=` on `urn:nl:grounding`), so the
