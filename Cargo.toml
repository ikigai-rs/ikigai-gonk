[package]
name = "ikigai-gonk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-gonk"
homepage = "https://github.com/ikigai-rs/ikigai-gonk"
keywords = ["ikigai", "roc", "ledger", "rdf", "server"]
categories = ["command-line-utilities", "development-tools"]
description = "A standalone ikigai work-ledger server: one binary that holds the durable RDF store and serves named ledgers over loopback HTTP (port 1062), an owner-only Unix socket, and QUIC authenticated per client certificate."

[[bin]]
name = "ikigai-gonk"
path = "src/main.rs"

[dependencies]
# ★ THE MANIFEST IS THE MODULE MANIFEST. This binary links the durable store, the work
# ledger, the repository browse family and three transports — and nothing else: no
# calendar, no LLM client, no inbound-network module beyond the doors themselves — and, since
# 0.1.1, the model it explains with is MOUNTED rather than linked (`gonk.mount`, one prefix:
# `urn:llm:`), so the outbound surface is one configured peer over ikigai's own transports
# rather than an HTTP client any net grant could point anywhere. What is
# not compiled in cannot be reached, whatever a capability says; what IS compiled in is
# reachable exactly as far as a capability carries, which is why the browse and repo
# families below are argued one door at a time in the README rather than merely listed.
# `tests/conformance.rs::the_served_catalog_is_exactly_the_store_and_the_ledger` (no browse
# roots) and `tests/browse.rs::the_served_catalog_is_exactly_what_this_manifest_links` (with
# them) pin the served catalog id by id, so a dependency bump that widens it is a red test.
#
# Every floor is the TRUE minimum of a set that compiles together, checked by resolving
# this manifest from scratch with every ikigai pin written `=<floor>` — a caret resolve
# picks the newest release and says nothing about the floor it claims.
#
# 0.1.70: `Kernel::with_cache_policy` and the `CachePolicy` trait arrive here, and
# `doors::NoCache` is how the socket and QUIC doors keep ONE cache (the hub's) for the
# whole process. Nothing lower can even be typed.
# ★ 0.1.78 is the floor now (ledger #515/#546): spaces have identity and the arrangement is
# a resource. This binary uses all of it — `Space::id`/`Space::topology` and the
# `Topology`/`SpaceKind` builders on its hand-written spaces (`doors::HubSpace`,
# `browse::CachedReads`), `.named(..)` on the hub's `Fallback` and every
# `EndpointSpace` it builds (`crate::spaces`), `Resolved::with_answered_by` on a forwarded
# hit, and `Kernel::topology` to read the hub's root off the arrangement (a kernel hands out
# no root space). `tests/topology.rs` sources `urn:kernel:topology` through every door and
# is the floor test: nothing below 0.1.78 has the trait methods.
# ★ 0.1.80 is the floor now, and it is a RESOLUTION floor rather than an API this binary
# calls: the cli 0.1.30 transports below (wire v8, ledger #583/#597) require `^0.1.80`, which
# is where `Error::Conflict` arrives, so a lower pin here is one this build can never resolve.
# Nothing in gonk constructs or matches `Conflict` yet — the ledger's claim refusal moving to
# it is ledger #584, the next wave. 0.1.81 (levels and seals, ledger #600) is admitted by the
# caret and not relied on.
# ★ 0.1.84 is the floor now, and it is a RESOLUTION floor again: `ikigai-intray` 0.1.36 below
# (in-flight recovery, ledger #738/#742) requires `^0.1.84`, so a lower pin here is one this
# build can never resolve. Nothing between 0.1.81 and 0.1.84 is called by name here.
# ⚠ `"0.1.84"` is also a ceiling (`<0.2.0`); when core reaches 0.2 this line must move.
# 0.1.85 since cli 0.1.39 (whose transports pin it): the capability floor covers every verb
# and a verbless requires is enforced (ledger #750). gonk's own endpoints declare their verbs.
# 0.1.86: deny-shaped scopes survive attenuate/clamp (ledger #858).
# ★ 0.1.93 is the pin now (ledger #1087's re-pin): every ikigai pin moved to its published head
# on 2026-10-10. Between them: `urn:kernel:explain`/`dependents` (0.1.87), spaces named
# `urn:iki:space:*` and a bound door dropping a space's name (0.1.89, ledger #987), an action
# match with its own identity (0.1.91, ledger #948), a failed invocation as a trace node
# (0.1.92), and principals as capability scopes (0.1.93, ledger #1077) — which gonk's doors
# adopt (`Capability::with_principal`), so 0.1.93 is also an API floor.
# ★ 0.1.95 since ledger #939, a RESOLUTION floor: `ikigai-script` 0.2.1 below requires it (the
# kernel cuts a Sink's target when the endpoint ran and failed, so a failed script run still cuts
# its runs thread). Nothing in gonk calls 0.1.94 or 0.1.95 API by name.
# ★ 0.1.96 since ledger #1287, a RESOLUTION floor: the cli-workspace crates at 0.1.52 (`ikigai-quic`
# below, for the restarted-peer heal) require `^0.1.96`. Nothing in gonk calls 0.1.96 API by name.
# ★ 0.1.98 since ledger #1330's arc (2026-10-12): the published head, and the release that
# replaced 0.1.97, which shipped from the draft vocabulary branch and is YANKED. Between 0.1.96 and
# it: a `%` in a name is a character in every face (ledger #1345, #1352), an authored scope is
# escaped, parsed or kept as a literal everywhere (ledger #1356), and the floor memo degrades past
# its bound (ledger #791). Nothing in gonk calls 0.1.97 or 0.1.98 API by name; the cli 0.1.55
# crates below still ask only `^0.1.96`. The lock carries 0.1.99 (published the same day: core's
# validate refuses a name no IRI can carry, ledger #1351). `"0.1.98"` is `<0.2.0`.
# ★ 0.1.102 is the floor now (the 2026-10-14 wave, ledger #1489, #439), and an API one:
# `Capability::satisfies`, the kernel's own declared-scope predicate, which `crate::trigger`'s
# reviewer pre-flight calls in place of the hand copy it carried while that predicate was
# `pub(crate)`. Also in 0.1.102 and reaching this server: typed selection ends with every
# input-free action (ledger #271), `want=` compares by media type, and every `urn:kernel:*`
# operation records a trace event. `"0.1.102"` is `<0.2.0`.
# ★ 0.1.108 is the floor now (ledger #1546, #1923), and an API one: the failure classes.
# `Error::RetryAfter { delay, detail }`, `Error::OverBudget`, `Error::Refused`,
# `Error::Unsupported` and `Error::class()`. `ikigai-throttle` 0.2.0 (below) refuses a window
# with `RetryAfter`, `ikigai-web` 0.1.66 (below) answers it `429` with `Retry-After`, and the
# access log (`src/access.rs`) writes `Error::kind()`'s word, which 0.1.108 gives the four new
# variants (`retry-after`, `over-budget`, `refused`, `unsupported`). `is_transient()` is
# unchanged: a `RetryAfter` is NOT transient. Not taken here: `Kernel::with_retry_budget` and
# `issue_with_context` (a retry budget and a run deadline minted at the doors; the hand-back of
# ledger #1923 says what that takes). `"0.1.108"` is `<0.2.0`.
# ★ 0.1.110 is the floor now (ledger #2006 arc 2, #2061), and an API one: named views. A
# `DynamicSpace` (0.1.109) placed last in the hub, rebuilt from a declaration in the store, whose
# `ik:Alias` rules are marked `ik:resolveAt "root"` (0.1.110) so a view forwards to a name the hub
# serves elsewhere (`crate::views`). The `declare` feature brings the Turtle reader the
# declaration is parsed with (`Topology::from_turtle`, `DynamicSpace::install`/`refresh`/`drive`).
# `"0.1.110"` is `<0.2.0`.
ikigai-core = { version = "0.1.110", features = ["declare"] }
# The Meta renderer, and in a server that is not a formatting choice: a mounting client
# reads every contract through the JSON Meta face (0.1.47+), and without it named
# arguments are silently dropped across the mount. 0.1.69 rather than 0.1.47 because
# `ikigai-conformance` 0.3 requires `^0.1.69` and cargo unifies a package across normal
# and dev dependencies — one lock serves `build` and `test`, so it is the version the
# shipped binary links.
# 0.1.93: the published head, beside core (they ship from one workspace).
# 0.1.96 (ledger #1287): a resolution floor, `ikigai-engine` 0.1.52 requires `^0.1.96`.
# 0.1.98: core's lockstep release (0.1.97 is yanked here too).
# 0.1.102: core's lockstep release.
# 0.1.108: core's lockstep release (`ik:mayFail`, `ik:FailureClass` and its seven individuals,
# which gonk's own descriptions do not yet use). `"0.1.108"` is `<0.2.0`.
ikigai-vocab = "0.1.108"
# The durable dataset. `persistent` is the RocksDB backend, and it is the reason this
# binary exists: gonk is the one process on a machine that holds `~/.ikigai/store`.
# 0.2.4 is where the freshness half of this pin comes from, and it is the whole of what
# this server says about it: `open_shared_declaring` + `SharerWrites` let gonk NAME the
# graphs its sharer (`ikigai-browse`) may write, so the store itself declares a scoped read
# of every other graph cacheable — which is what `src/freshness.rs` used to do from outside,
# on four IRIs it transcribed by hand. `reserved_graphs_fingerprint` is the tripwire that
# checks the promise, and `tests/browse.rs` takes it. (0.2.2 is yanked and does not compile
# in any graph where a sibling enables `oxrdf/rdf-12`; 0.2.2 is also where `cap_read_graph`
# — the narrow read door `grants.rs` computes tokens from — first exists.)
#
# ★ **0.2.5 is the floor because a SCOPED READ NOW TAKES A SET OF GRAPHS, and this server
# uses it.** Through 0.2.4 `confine` set the prepared query's whole dataset specification to
# the ONE graph the read was issued for, so the ledger↔browse join — the motivating query of
# the graph decision, and of ledger #250 and #376 — could not be expressed through the narrow
# door however many per-graph tokens the caller held, and came back EMPTY rather than refused.
# In 0.2.5 `graph=` takes several IRIs separated by whitespace in ONE value (`graph="A B"`),
# the dataset becomes `FROM`/`FROM NAMED` over the set, and a graph the caller cannot grant
# refuses the WHOLE read with every missing `urn:cap:store:read:graph:` token named.
# `tests/browse.rs::both_read_tokens_run_the_ledger_browse_join` is this server's use of it —
# so `^0.2.4`, which already admitted 0.2.5, is now a floor that states the truth (rule 5).
#
# ⚠ Two consequences taken with it. The set is ONE argument: `graph=A graph=B` is last-wins
# in the engine (ledger #387) and would silently narrow to `B` — the failure this pin closes,
# re-opened one layer up. And a multi-graph read is cacheable only if EVERY member is, so the
# join over browse's sharer-written graph is uncached by construction while the ledger's own
# scoped read stays cached; `the_browse_graphs_scoped_reads_are_not_cached_and_the_ledgers_
# still_are` asserts both. 0.2.5 also renames the graph-list resource to `urn:iki:store:graphs`
# (one more id in the served catalog, pinned by `tests/conformance.rs`) and deprecates
# `is_covered`; nothing here calls it — `read_is_covered` is a different function. 0.2.6 (the
# audit release, ledger #751): an update with a WHERE needs the READ grant on what it reads
# (hence purge's graveyard read token), and two live spaces over one store forfeit coverage.
# ★ 0.2.8 is the floor now (ledger #979, #964): every SPARQL evaluation runs within a TIME
# budget — a 5 s base, `urn:cap:store:budget:<ms>` grants up to a 120 s ceiling, root at the
# ceiling, and a request's `budget=` that can only lower it. This server uses the API: the
# scheduled backup fires holding a budget grant (`backup::JOB_SCOPES`), because its
# whole-dataset query takes longer than the base on the live dataset. ★ 0.2.9 is the floor now
# (ledger #993, #970): every SPARQL answer is bounded in SIZE — 100,000 rows and 16 MiB for a
# scoped caller, `urn:cap:store:answer:<rows>` and `…:answer:bytes:<bytes>` grants up to 10,000,000
# rows and 1 GiB — and the backup's answer is every quad, so `backup::JOB_SCOPES` carries both
# grants, spelled through `budget::cap_answer{,_bytes}` in its tests. As a caret this is
# `>=0.2.9, <0.3.0`: a 0.3 store is a deliberate move, not a `cargo update`.
# ★ 0.2.10 is the floor now (ledger #1083, #992, #1085): SPARQL `SERVICE` is refused by every
# door and by the evaluator in every build, and `LOAD` is refused, so a grant to the store is no
# network egress. Nothing in gonk sends either (a SPARQL page or a socket caller that did now
# gets a refusal naming it). Also: the SPARQL thread is sized for the build (ledger #1003).
# ★ 0.2.12 is the floor now (ledger #1127, store PR #32): a PERFORMANCE floor for this server's
# reads. Through 0.2.11 every update committed on a freshly spawned thread, and RocksDB seeds a
# memtable skiplist's node heights from a hash of the thread id, which a reused thread id
# repeats, so the skiplists stopped growing upper levels and every read after a run of writes
# walked a long top level until the memtable flushed: 2.8x to 13.9x slower in release, 3.3x to
# 8.4x on the ledger's own `items` read. gonk is the process that writes the store, so it is the
# one that degraded. 0.2.12 runs every update on ONE long-lived writer thread per store (writes
# were already serialized by the store's write lock, so nothing new is serialized). 0.2.11 on
# the way: consumer-worded SERVICE refusals exported as `ikigai_store::service`, additive.
# ★ 0.2.14 is the pin now (ledger #1198, the dependency wave): 0.2.13 (ledger #1132) copies a
# scoped update's FOOTPRINT rather than the whole graph, so a ledger write no longer costs the
# size of its ledger; 0.2.14 (ledger #1207) exports `SharedWriter`, the store's own writer thread
# for a host writing through the raw handle. gonk calls neither by name (browse, its raw-handle
# sharer, carries its own writer thread since 0.18.4), so this is the published head taken as a
# stated floor: what was built and tested.
# ★ 0.2.15 is the floor now, for an API this binary calls (ledger #1252): `SharedWriter::store`
# and `SharedWriter::declared`, and a `DurableStore::shared_writer` that carries the
# `open_shared_declaring` declaration and enforces it. `main` hands browse
# `store.shared_writer()` (see `ikigai-browse` below), so browse's archive writes commit on the
# store's OWN writer thread under its write lock; browse 0.18.6 requires `^0.2.15` too.
# ⚠ `"0.2.15"` is `<0.3.0`.
# ★ 0.2.19 since ledger #1330's arc, a SECURITY floor and not an API one: 0.2.18 adds
# `EvaluationBudget` (ledger #1327; cli 0.1.55's edge door takes it), and 0.2.19 bounds the
# triple terms an update may leave in the store and how deep a triple-term template nests (ledger
# #1333, #1354). gonk calls none of it by name; every caller's SPARQL reaches the store's own
# doors, which carry the bounds.
# ★ 0.2.21 is the floor now, a SECURITY floor and not an API one (ledger #1426, #1427, #1428,
# #1429): a GRAPH block and the planner-erasable wrappers hid join operands from
# MAX_JOIN_OPERANDS, so an in-bounds query planned uncancellably for minutes (0.2.21, with the
# rdf/sparql 0.2.3 fix it rides on, counts operands as the planner sees them); the overdue cap
# reserves its slot when a read starts; `urn:iki:store:load` bounds a document's size and its XML
# entity expansion. gonk calls none of it by name. Two behavior changes reach this server: a real
# FILTER closing a group now counts that group into the enclosing join (the widest join gonk
# sends is well inside the bound), and read parallelism is capped by `max_overdue` (default
# cores/4, minimum 1; further reads wait). gonk sets no `max_overdue`. `"0.2.21"` is `<0.3.0`.
# ★ 0.2.22 is the floor now, a BEHAVIOR one (ledger #388, #1489): a scoped read whose query names
# a constant `GRAPH <iri>` outside the caller's set is REFUSED (`InvalidArgument` on `query`,
# naming each graph), where through 0.2.21 it was answered empty. The SPARQL page's sample and
# its cross-graph note say so (`crate::web`), and the browse join test pins the refusal
# (`tests/browse.rs`). `GRAPH ?g` is unchanged. Also in 0.2.22: a `SharedWriter` join names what it
# narrowed away, and the widest-join count is public. `"0.2.22"` is `<0.3.0`.
ikigai-store = { version = "0.2.22", features = ["persistent"] }
# Named ledgers over the store's narrow per-graph doors. 0.2.1 is the floor: through
# 0.2.0 `item:{id}` declared the BROAD `urn:cap:store:read`, so a caller holding exactly
# the per-ledger grant list this server hands out could list a ledger and was denied
# reading one item out of it. ★ 0.3.0 is the floor now (ledger #768): unique ids (0.2.x minted
# one IRI for concurrent same-millisecond appends, so two filings merged), a delete that keeps
# a racing write, purge that reaches a deleted item (and READS the graveyard, so purge carries
# `cap_read_graph(<L>:deleted)`, see `grants.rs`), and `next` over every open item.
# ★★ 0.4.0 is the floor now (ledger #779, #810): the keyed append (`append key=`, one store
# update, a taken key answers the existing item) and the JSON face (`ikigai_ledger::json`,
# schema 1). The roborev and kata bridges are built on both — before it they checked
# `items?about=` and then appended, which raced, and parsed the plain face.
# ★ 0.5.0 is the floor now (ledger #775 step 3): lifecycle state as a compare-and-set atom,
# leased claims with a HOST-stamped kind (`SpaceConfig::claim_kind`, which this server sets
# from the door's principal: `crate::kind`), takeover of an expired lease, assertions, and the
# read-only doctor this server renders as a page. The doctor's JSON (`json::DoctorDocument`)
# and the claim's `kind`/`expires`/`lease` are read here.
# ★ 0.6.2 is the floor now (ledger #419, #987, #1085): `urn:iki:ledger:items` pages by ITEM with
# `offset=`, and its JSON face carries `total`, a COUNT over the filter — the ledger page reads
# both (`crate::web`'s listing) instead of reading 2000 items to count them. 0.6.0 names its
# space `urn:iki:space:ledger`; 0.6.1 draws the id nonce from getrandom on wasm; 0.6.2 takes
# store 0.2.10 as a security floor. `^0.5.0` was `<0.6.0`: a ceiling, so this had to move.
# ★ 0.8.0 is the floor now (ledger #1143, #1198), and an API one: 0.7.0 (never published on its
# own) splits three verbs out of the write grant, `urn:cap:ledger:{claim,comment,close}:{L}`
# (`Ledger::cap_claim`/`cap_comment`), which is what `grants::Authority::Worker` mints: claim,
# renew, release and comment, never close. It also makes a close release the claim, adds keyed
# comments, and makes a release a compare-and-set with `from=`. 0.8.0 adds the hand-back state
# (`comment handback=true`, `next` skips an item awaiting its dispatcher) and records a claim's
# PRINCIPAL beside its free-text holder, so a client principal the QUIC door mints owns its claim
# and another worker holding the same lines cannot release it.
# ★ 0.9.0 is the floor now (ledger #1128, #1198), and an API one: `urn:iki:ledger:{L}:count`,
# the filter's total as its own resource. The ledger page reads it (`crate::web`'s listing)
# instead of `items limit=1` as JSON, whose face always ran the corpus check: a cold render's
# total went from seven store queries to one (`tests/ledger_count_1198.rs`). It declares the
# same read row `items` does, so every grant that reads a ledger, the worker's included, may
# count it. `"0.9.0"` was `<0.10.0`: a ceiling too.
# ★ 0.11.0 is the floor now (ledger #1330), and an API one twice over. 0.10.0 (ledger #1315)
# splits `urn:cap:ledger:about:{L}` out of the write grant (`Ledger::cap_about`), so the layer
# mirror records an offer as an `about` edge on its item (`crate::mirror`) holding the worker
# grant plus that token, still never close. 0.11.0 (ledger #1329) adds `ClaimKind::Agent`, which
# `crate::layer::kind_for` stamps for a `prov:SoftwareAgent` participant (a collaborator's Claude)
# instead of `Machine`; the enum is `#[non_exhaustive]` from 0.11.0, so a later kind is a minor.
# `"0.11.0"` is `<0.12.0`.
# 0.11.1 (ledger #1418, #1419, #1420, #1422, #1423, #1426), fixes and no API change: `next` walked
# a `blocks` chain recursively, so a 15,000-item chain overflowed its stack and ABORTED the
# process that holds the store, which is this one; a ledger past ~19,400 items passed the store's
# 1 MiB SPARQL bound on `next`; a hand-back or a claim on a CLOSED item is refused as a conflict
# and writes nothing; and the store floor is 0.2.21 (above). 0.11.0 is still the API floor.
# `"0.11.1"` is `<0.12.0`.
# ★ 0.12.0 (ledger #1452, #1454, #1455, #1489): `labels=` at any length, `parent=` on an append and
# an item's `children` (the JSON item face carries `children: []` on every item), and the
# hand-back reason in `next`. gonk calls none of it by name; its JSON readers (`crate::taker`,
# `crate::mirror`, `crate::kata`) deserialize `ikigai_ledger::json`, so the new field arrives
# typed and a fixture built without it still parses. `"0.11.1"` was `<0.12.0`: a ceiling, so
# this had to move. 0.11.0 is still the API floor. `"0.12.0"` is `<0.13.0`.
ikigai-ledger = "0.12.0"
# ★ Scripts as resources (ledger #939): `urn:script:*` — a published SPARQL query or plan is a
# resource with content-addressed versions, run as a READ at `…:result` and for EFFECTS at
# `…:runs`, every run recorded with the principal the door minted (`crate::script`). 0.2.1 is the
# floor and an API one: 0.2.0 is where the principal is read from the CAPABILITY (core 0.1.93's
# `urn:cap:principal:`, which every door here mints) instead of a host stamper, and 0.2.1 is where
# a failed run cuts the runs thread too (core 0.1.95 — which is why the core line above moved).
# ★ 0.3.0 is the floor now (ledger #1196, #1173, #1174): a run IGNORES the transports' own
# arguments (`ikigai_script::TRANSPORT_ARGUMENTS`: `received`, `client`, `principal`,
# `content-type`) instead of refusing them as undeclared parameters, so the per-door strip
# this server carried through 0.2.x (`doors::TRANSPORT_STAMPS`) is gone, and a script grant
# may name a NAMESPACE (`urn:cap:script:{act}:{namespace}-*`, `authority::cap_namespace`),
# which `--script team-*=publish` mints. On 0.2.x a stamped run through the HTTP door is a
# `400` without the strip, so this is an API floor. ⚠ `"0.3.0"` is `<0.4.0`.
# The lock carries 0.3.3 (ledger #1261, ikigai-script PR 20): running a DRAFT answers "is a draft;
# publish it" instead of a misleading `urn:cap:lisp` refusal, and a SPARQL draft's refusal no
# longer points at `urn:script:eval`, which refuses SPARQL. A better refusal, not an API this
# binary calls, so 0.3.0 stays the stated floor.
# 0.3.5 (ledger #1384, #1458, #1489): a script may declare a store time budget, bounded like the
# rest of its authority (0.3.4), and the ledger 0.11.1 / store 0.2.21 security floor (0.3.5).
# gonk calls neither by name; this is the published head taken as a stated floor, what was
# built and tested. 0.3.0 is still the API floor. `"0.3.5"` is `<0.4.0`.
ikigai-script = "0.3.5"
# ★ The rate on ANONYMOUS script runs (ledger #1175, `crate::script::ANONYMOUS_RUNS`): one
# `RateLimit` overlay over the script family, consulted only for a run whose capability carries
# the anonymous door's marker, which is the advice `ikigai-script`'s README gives a host that
# lets anonymous callers run ("Rate-limit the door (`ikigai-throttle`)"). 0.1.11 is the published
# head and what was built and tested (`RateLimit` and `Rate` are older, but no earlier release
# was built here). Its floor of core is 0.1.78, below the line above; it adds itself and five
# small runtime-agnostic crates to the lock (`futures-timer`, `async-lock` and the
# `event-listener` family `async-lock` is built on). ⚠ `"0.1.11"` is `<0.2.0`.
# ★ 0.2.0 is the floor now, a BEHAVIOR one (ledger #1546, #1923, ikigai-rs/ikigai-throttle PR 24):
# `RateLimit` refuses a resolution over its window with the typed `Error::RetryAfter { delay,
# detail }` (class `retry-after`) in place of the permanent `Error::Endpoint("rate-limited …")`
# 0.1.11 answered. Both of gonk's windows (`budget::Window`: the anonymous runs, the model
# calls) are `RateLimit` overlays, so their refusal is typed now and the HTTP door answers it
# `429` with `Retry-After` (see `ikigai-web` below) — ledger #1216 part (1). The refusal's text
# changed with it: 0.1.11 said ``rate-limited: `key` is capped at 30/60s — retry after Ns``; 0.2.0
# says ``retry after N ms: rate-limited: `key` is capped at 30 per 60s`` (the `Display` of the
