[package]
name = "ikigai-gonk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-gonk"
description = "A standalone ikigai work-ledger server: one binary that holds the durable RDF store and serves named ledgers over loopback HTTP, an owner-only Unix socket, and certificate-authenticated QUIC."

[[bin]]
name = "ikigai-gonk"
path = "src/main.rs"
