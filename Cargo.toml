# shape, a new json field.
# ★ 0.14.0 (ledger #653, browse PR #53) makes a decision REVISABLE and says whether a decline was
# MEANT: the finding Sink takes `revises=<current decision IRI>` (both answers kept), its
# `decision` one_of gains a withdrawal word that is refused on an undecided finding (so the
