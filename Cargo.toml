# `tests/browse.rs::git_metadata_is_absent_through_both_doors` is the FLOOR TEST: red on 0.18.1.
# `^0.18.2` is `<0.19.0`. Patch: a narrowed read (it refuses paths that used to be served).
# 0.18.4 (ledger #1131, #1198): browse commits every archive write on ONE long-lived writer
# thread, so reads after a run of writes stay fast (RocksDB seeds a memtable skiplist's heights
