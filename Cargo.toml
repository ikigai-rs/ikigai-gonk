# The controller key's keystore (the Keychain on a Mac) and `urn:secret:generate`, which mints it
# (`ikigai-gonk onboard init`). The server reads the key through the `Backend` trait for the one
# signing call and never serves `urn:secret:*` at any door. 0.2.0 is the published head and the
# `generate` the init calls; `"0.2.0"` is `<0.3.0`.
ikigai-secret = "0.2.0"
# The pairing code's proof: HMAC-SHA256 (RFC 2104) over the fingerprint, checked in constant time
# (`Mac::verify_slice`), over the `sha2` above. Already in this graph (through the QUIC stack), so
# this adds an edge, not a package. `"0.12.1"` is `<0.13.0`.
hmac = "0.12.1"

[dev-dependencies]
# The module recipe as one test, walked over the kernel `main` serves. ⚠ This pin is a
# PRODUCTION floor too: see the vocab note above. 0.8.0: REQUIRED (a required input dropped
# must be refused, typed), VALIDATE, and `Suite::own`, which scopes every walk here to gonk's
# own resources and pins the rest as inherited. `"0.6.1"` was `<0.7.0`, so gonk was held to
# an old definition of "done"; `"0.8.0"` is `<0.9.0`.
# 0.10.0 (ledger #1546, #1923): FAILURES (an action that states its failure classes is held to
# them) and `Suite::fails_under`, OPT-IN through `Suite::check_failures()` for this one minor and
# the default from 0.11.0. `tests/conformance.rs` and `tests/backup.rs` opt in now, so the flip
# changes nothing here; gonk's own actions declare no `fails` yet. `"0.10.0"` is `<0.11.0`.
ikigai-conformance = "0.10.0"
futures = "0.3"
tempfile = "3"
# A software authenticator: `tests/web.rs` signs real ES256 assertions, so the passkey path
# is exercised end to end over HTTP — the same key type `ikigai-passkey` verifies.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
# The WCAG contrast floor the page's palette is held to, in both color schemes.
ikigai-a11y = "0.2.1"
# The scripted layer host the mirror's tests run against (ledger #1190): the published layer
# host, in process, behind a door that mints each participant's principal. ★ 0.2.2 is the
# floor (ledger #1316): it serves `urn:layers:me`, which the mirror and the taker read for
# their own principal, and `tests/layer_mirror_1190.rs` resolves a lost take reply BEFORE the
# first take through it. (The tests still bind `urn:collab:{name}:participants` themselves, as
# they did when 0.2.1 was unpublished.) A dev-dependency only: gonk reaches a layer host over
# the wire. 0.2.8 (ledger #1377): the published head, moved with the cli 0.1.58 crates; 0.2.2 is
# still the floor the tests need for the layer host itself.
# ★ 0.2.9 (ledger #1405) is the floor now, for the BUILD rather than the API: it takes
# ikigai-shacl with `default-features = false`. Through 0.2.8 it took the defaults, and since a
# test build unifies dev-dependency features, that one edge turned rudof back on in every gonk
# test build, so the tests validated plans with a different engine than the binary ships (see
# the ikigai-shacl note above). `"0.2.9"` is `<0.3.0`.
# 0.2.10 (ledger #1403): the published head, moved with the cli 0.1.61 crates. It puts the layer
# host behind a default `host` feature (`default-features = false` is the participant surface);
# the default is unchanged and these tests need the host, so the line keeps the defaults. 0.2.9
# is still the build floor above. `"0.2.10"` is `<0.3.0`.
# ★ 0.3.0 (ledger #2021): the published head, moved with the cli 0.1.67 crates. It seals a host's
# state at rest, so `Host::open` takes a `StateKey`: each test mints an age identity (`age` below)
# and loads it, as the layers crate's own tests do. `"0.3.0"` is `<0.4.0`.
# 0.3.1 (ledger #2042): bounds Turtle nesting at 64 levels before participant-side parsing.
# ★ 0.4.0 (ledger #2009): the onboarding lobby and the grants layer, which
# `tests/onboard_2009.rs` drives end to end. The same version as the normal dependency above (a
# participant there; the host here, so a test build unifies to the host). `"0.4.0"` is `<0.5.0`.
ikigai-layers = "0.5.0"
# An age X25519 identity for the layer host's state key in the tests above (ikigai-layers 0.3.0's
# own `age` floor).
age = "0.11.1"
